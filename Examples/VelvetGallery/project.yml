name: VelvetGallery
options:
  bundleIdPrefix: com.matiasperaltacharro
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
packages:
  VelvetUI:
    path: ../..
targets:
  VelvetGallery:
    type: application
    platform: iOS
    sources:
      - path: VelvetGallery
    dependencies:
      - package: VelvetUI
        product: VelvetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matiasperaltacharro.VelvetGallery
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  GalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GalleryUITests
      # The stage list and appearance enum are shared with the app, so the
      # smoke test always covers every stage.
      - path: VelvetGallery/Stages/Stage.swift
      - path: VelvetGallery/Support/Appearance.swift
    dependencies:
      - target: VelvetGallery
      - package: VelvetUI
        product: VelvetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matiasperaltacharro.GalleryUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: VelvetGallery
schemes:
  VelvetGallery:
    build:
      targets:
        VelvetGallery: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GalleryUITests
