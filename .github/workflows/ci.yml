name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · swift build & test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Registry (each component compiles on its own, Swift 5 and 6)
        run: swift scripts/velvet.swift verify
      - name: llms.txt and llms-full.txt are up to date
        run: swift scripts/velvet.swift llms --check

  ios:
    name: iOS Simulator · xcodebuild
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        id: sim
        # Runner images change which simulators they ship, so take the first
        # iPhone on the newest installed iOS runtime instead of hard-coding one.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [r for r in devices if ".iOS-" in r]
          runtimes.sort(key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")], reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No iPhone simulator available")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"
      - name: Test the package on iOS
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme VelvetUI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build/xcode-ios
      - name: Build VelvetGallery
        run: |
          set -o pipefail
          xcodebuild build \
            -project Examples/VelvetGallery/VelvetGallery.xcodeproj \
            -scheme VelvetGallery \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode-gallery \
            CODE_SIGNING_ALLOWED=NO

  gallery-ui:
    name: Gallery UI tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = [r for r in devices if ".iOS-" in r]
          runtimes.sort(key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")], reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No iPhone simulator available")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
      - name: Run the Gallery UI tests
        # Every stage launches in light and dark (StageSmokeTests), plus one
        # interaction test per component under GalleryUITests/Components.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Examples/VelvetGallery/VelvetGallery.xcodeproj \
            -scheme VelvetGallery \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build/xcode-gallery-ui \
            -resultBundlePath .build/GalleryUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p .build/gallery-screenshots
          [ -d .build/GalleryUITests.xcresult ] && xcrun xcresulttool export attachments \
            --path .build/GalleryUITests.xcresult \
            --output-path .build/gallery-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-screenshots
          path: .build/gallery-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gallery-ui-xcresult
          path: .build/GalleryUITests.xcresult
          retention-days: 7
